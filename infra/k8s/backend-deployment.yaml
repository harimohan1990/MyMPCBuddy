apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-hub-backend
  namespace: mcp-hub
  labels:
    app: mcp-hub-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-hub-backend
  template:
    metadata:
      labels:
        app: mcp-hub-backend
    spec:
      containers:
      - name: backend
        image: mcp-hub-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: mcp-hub-config
        - secretRef:
            name: mcp-hub-secrets
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-hub-backend
  namespace: mcp-hub
spec:
  type: ClusterIP
  selector:
    app: mcp-hub-backend
  ports:
  - port: 8000
    targetPort: 8000
    name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mcp-hub-backend-hpa
  namespace: mcp-hub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mcp-hub-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
