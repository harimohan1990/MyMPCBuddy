apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-hub-frontend
  namespace: mcp-hub
  labels:
    app: mcp-hub-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-hub-frontend
  template:
    metadata:
      labels:
        app: mcp-hub-frontend
    spec:
      containers:
      - name: frontend
        image: mcp-hub-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: mcp-hub-config
              key: NEXT_PUBLIC_API_URL
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-hub-frontend
  namespace: mcp-hub
spec:
  type: ClusterIP
  selector:
    app: mcp-hub-frontend
  ports:
  - port: 3000
    targetPort: 3000
    name: http
