apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-hub-ingress
  namespace: mcp-hub
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "mcp-hub-backend"
spec:
  tls:
  - hosts:
    - mcphub.internal
    secretName: mcp-hub-tls-cert
  rules:
  - host: mcphub.internal
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: mcp-hub-backend
            port:
              number: 8000
      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: mcp-hub-backend
            port:
              number: 8000
      - path: /openapi.json
        pathType: Exact
        backend:
          service:
            name: mcp-hub-backend
            port:
              number: 8000
      - path: /health
        pathType: Exact
        backend:
          service:
            name: mcp-hub-backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mcp-hub-frontend
            port:
              number: 3000
